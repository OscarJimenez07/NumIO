services:
  db:
    image: postgres:16-alpine
    container_name: numio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-numio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-numio}
      POSTGRES_DB: ${POSTGRES_DB:-numio}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numio} -d ${POSTGRES_DB:-numio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: numio-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-numio}:${POSTGRES_PASSWORD:-numio}@db:5432/${POSTGRES_DB:-numio}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3000
      NODE_ENV: production
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Entra ID. Vacías = ingreso solo con correo y contraseña.
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_ALLOWED_DOMAINS: ${MS_ALLOWED_DOMAINS:-}
      PERMITIR_CONTRASENA: ${PERMITIR_CONTRASENA:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      # Sin SMTP, el código de ingreso se escribe en el registro del backend.
      CODIGO_EN_CONSOLA: "true"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DOCENTE_EMAILS: ${DOCENTE_EMAILS:-}
      # Cuentas demo con contraseña conocida: solo en desarrollo.
      SEED_USUARIOS_DEMO: "true"
    ports:
      - "3000:3000"
    command: sh -c "npx prisma db push --accept-data-loss --skip-generate && (npx prisma db seed || echo 'seed failed, continuing') && node dist/src/main.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Ruta relativa: nginx enruta /api al backend, de modo que la
        # interfaz sirve por cualquier dirección sin recompilar.
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: numio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dbdata:
